# Publishes a release whenever main carries a version (package.json) that has no release yet.
# Bump "version" in package.json, push or merge to main, and this builds the Windows installer and the
# Linux AppImage and publishes them as release v<version>. Installed copies pick it up on their next update check.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            script: package:win
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: Linux AppImage
            os: ubuntu-latest
            script: package:appimage
            files: |
              release/*.AppImage
              release/latest-linux.yml
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      # The icon manifests are hashed byte for byte; keep Windows from rewriting line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm test
        if: runner.os == 'Linux'
      # The Windows installer is built on Windows: electron-builder needs Wine to make an NSIS installer elsewhere.
      - run: npm run ${{ matrix.script }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist-release
          gh release create "v$VERSION" dist-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Street Brawl Companion $VERSION" --generate-notes --latest
